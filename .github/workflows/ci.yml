name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Ruff
        run: |
          python -m pip install ruff==0.17.1
          ruff check --output-format=github .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Install and render the example board
        env:
          BOTROLL_NOW: "2026-10-10 15:30"
        run: |
          python -m pip install .
          botroll --dir examples/tasks board
          botroll --dir examples/tasks board --html board.html
          botroll --dir examples/tasks board --json > board.json
          botroll --dir examples/tasks watch || test $? -eq 1
      - name: Box health sample (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/health && cp examples/tasks/*.md /tmp/health/
          botroll --dir /tmp/health health --config botroll-health.json.example --print > health.json
          python -c "import json; s = json.load(open('health.json')); assert s['cores'] > 0 and s['mem']['total_mb'] > 0"
          botroll --dir /tmp/health board --html board-health.html
          grep -q "Box health" board-health.html
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        with:
          name: example-board
          path: |
            board.html
            board.json
            board-health.html
