[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botroll"
dynamic = ["version"]
description = "An agent-first task list: every bot records what it's doing, done, and waiting on its human, in plain files."
readme = "README.md"
license = "MIT"
authors = [{ name = "Saad Kamal" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]

[project.scripts]
botroll = "botroll.cli:main"

[tool.hatch.version]
path = "botroll/__init__.py"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# pyflakes plus pycodestyle's error classes; CI pins the ruff version so new default rules can't break it.
select = ["E4", "E7", "E9", "F"]
